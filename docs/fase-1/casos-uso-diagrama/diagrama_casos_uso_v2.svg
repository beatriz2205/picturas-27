<text x="1119" y="560.0" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">Os perfis Free (Utilizador) e</text>
<text x="1119" y="574.95" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">Premium acedem aos mesmos</text>
<text x="1119" y="589.9" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">casos de uso de vídeo; mudam os</text>
<text x="1119" y="604.85" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">limites, a quota e a prioridade</text>
<text x="1119" y="619.8" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">na fila (RNG-03 a RNG-05).</text>
<text x="1119" y="634.75" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">O Anónimo não tem acesso a</text>
<text x="1119" y="649.7" font-size="11.5" text-anchor="start" fill="#1A1A1A" font-style="normal">vídeo (RNG-01).</text>
